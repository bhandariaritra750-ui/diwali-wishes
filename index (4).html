<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Diwali 🎆</title>

<style>* { margin: 0; padding: 0; box-sizing: border-box; }body { background: black; overflow: hidden; height: 100vh; font-family: Arial, sans-serif; }canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }.text { position: absolute; top: 43%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; z-index: 2; pointer-events: none; }.text h1 { font-family: cursive; font-style: italic; color: rgb(255, 87, 34); }.text p { color: white; letter-spacing: 5px; margin-top: 12px; font-size: 15px; }@keyframes glow{  }</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="text">
    <h1>Happy Diwali</h1>
    <p>✨ FESTIVAL OF LIGHTS ✨</p>
</div>

<script>

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];

function resize() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resize();

window.addEventListener("resize", resize);


// Particle class
class Particle {

    constructor(x, y, color) {

        this.x = x;
        this.y = y;
        this.color = color;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 1;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.alpha = 1;
        this.decay = Math.random() * 0.012 + 0.008;

        this.size = Math.random() * 2.5 + 1;
    }

    update() {

        this.x += this.vx;
        this.y += this.vy;

        this.vy += 0.035;

        this.vx *= 0.985;
        this.vy *= 0.985;

        this.alpha -= this.decay;

        return this.alpha > 0;
    }

    draw() {

        ctx.save();

        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;

        ctx.shadowBlur = 18;
        ctx.shadowColor = this.color;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


// Firework explosion
function explode(x, y) {

    const color =
        `hsl(${Math.random() * 360}, 100%, 60%)`;

    for (let i = 0; i < 110; i++) {

        particles.push(
            new Particle(x, y, color)
        );

    }

    // Prevent unlimited particle growth
    if (particles.length > 12000) {
        particles.splice(0, particles.length - 12000);
    }
}


// Input controls
let isPressed = false;

let mouseX = 0;
let mouseY = 0;

let lastExplosion = 0;

const explosionDelay = 50;


// Touch and mouse position
window.addEventListener("pointerdown", (e) => {

    // Only primary mouse button or primary touch
    if (!e.isPrimary) return;

    if (e.pointerType === "mouse" && e.button !== 0) {
        return;
    }

    e.preventDefault();

    isPressed = true;

    mouseX = e.clientX;
    mouseY = e.clientY;

    lastExplosion = 0;

}, { passive: false });


// Follow finger or mouse
window.addEventListener("pointermove", (e) => {

    if (!e.isPrimary) return;

    if (!isPressed) return;

    e.preventDefault();

    mouseX = e.clientX;
    mouseY = e.clientY;

}, { passive: false });


// Stop when finger or mouse is released
window.addEventListener("pointerup", (e) => {

    if (e.isPrimary) {
        isPressed = false;
    }

});


// Stop if touch is cancelled
window.addEventListener("pointercancel", () => {

    isPressed = false;

});


// Stop when window loses focus
window.addEventListener("blur", () => {

    isPressed = false;

});


// Animation loop
function animate(time) {

    ctx.fillStyle = "rgba(0, 0, 0, 0.20)";

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    // Fireworks every 50 milliseconds
    if (
        isPressed &&
        time - lastExplosion >= explosionDelay
    ) {

        explode(mouseX, mouseY);

        lastExplosion = time;
    }


    // Update particles
    particles = particles.filter(p => {

        p.update();
        p.draw();

        return p.alpha > 0;

    });

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>



</body></html>
